{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center" style="min-height: 80vh;">
    <div class="glass-panel" style="padding: 2.5rem; width: 100%; max-width: 420px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <img src="{{ url_for('static', filename='images/logo_white24.png') }}" alt="Logo" class="login-logo">
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">🔑 Yeni Şifre Belirleme</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                Kullanıcı: <strong style="color: var(--primary);">{{ username }}</strong>
            </p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="flex-col gap-4">
            <div class="flex-col gap-2">
                <label for="password" style="font-size: 0.9rem; color: var(--text-muted);">Yeni Şifre <span style="color:var(--danger)">*</span></label>
                <input type="password" id="password" name="password" class="glass-input" required minlength="6"
                    placeholder="******" autocomplete="new-password">
                <small style="font-size: 0.75rem; color: var(--text-muted);">
                    En az 6 karakter, 1 büyük harf, 1 küçük harf, 1 rakam ve 1 özel karakter içermelidir.
                </small>
            </div>

            <div class="flex-col gap-2" style="margin-bottom: 1rem;">
                <label for="confirm_password" style="font-size: 0.9rem; color: var(--text-muted);">Yeni Şifre (Tekrar) <span style="color:var(--danger)">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="glass-input" required minlength="6"
                    placeholder="******" autocomplete="new-password">
            </div>

            <button type="submit" class="glass-btn" style="width: 100%;">Şifreyi Güncelle</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{ url_for('login') }}" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: underline;">
                    Giriş Ekranına Dön
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
